# Labelled evaluation set for retrieval and refusal.
# source: file the answer lives in (relative to the corpus root); span: a short exact phrase from the
# passage that answers the question (a retrieved chunk counts as relevant only if it contains the span,
# so the labels do not depend on the chunk size). style: "lexical" = shares key words with the source,
# "paraphrase" = asks the same thing in different words (the realistic, harder case).
# kind: in_scope (answer is in the KB) | out_of_scope (answer is NOT in the KB -> the agent should not
# answer from the KB; it should fall back to the web or decline).
in_scope:
  # ---------------- sample KB (fictional NovaRetail) ----------------
  - {q: "How do I connect to the NovaSecure VPN from home?", source: sample_kb/company_it_handbook.md, span: "Install the NovaSecure VPN client", style: lexical}
  - {q: "My remote connection to the corporate network keeps dropping, what should I try first?", source: sample_kb/company_it_handbook.md, span: "restart the client, and try another corporate gateway", style: paraphrase}
  - {q: "What is the minimum password length at NovaRetail?", source: sample_kb/company_it_handbook.md, span: "at least 14 characters", style: lexical}
  - {q: "I typed my password wrong several times and now I can't get in. Why?", source: sample_kb/company_it_handbook.md, span: "After five failed login attempts", style: paraphrase}
  - {q: "Which MFA methods are approved?", source: sample_kb/company_it_handbook.md, span: "company authenticator app and registered hardware security keys", style: lexical}
  - {q: "Can I use text messages as my second factor?", source: sample_kb/company_it_handbook.md, span: "SMS should only be used when explicitly enabled", style: paraphrase}
  - {q: "Where am I allowed to install business software from?", source: sample_kb/company_it_handbook.md, span: "only from the company Software Portal", style: lexical}
  - {q: "Will IT give me admin rights so I can install an app that isn't in the catalogue?", source: sample_kb/company_it_handbook.md, span: "Administrator access is not granted simply to install unapproved applications", style: paraphrase}
  - {q: "I left my work notebook computer on the train. What do I do?", source: sample_kb/company_it_handbook.md, span: "Immediately report a lost or stolen company laptop", style: paraphrase}
  - {q: "A user cannot send or receive email, how should the service desk troubleshoot?", source: sample_kb/service_desk_runbook.md, span: "confirm whether the issue affects one user or many users", style: lexical}
  - {q: "Lots of people suddenly can't get their mail, should we ask them to reinstall Outlook?", source: sample_kb/service_desk_runbook.md, span: "do not ask each user to reinstall software", style: paraphrase}
  - {q: "What should I check when a laptop is running slowly?", source: sample_kb/service_desk_runbook.md, span: "check CPU, memory, storage free space", style: lexical}
  - {q: "What does P2 priority mean for a ticket?", source: sample_kb/service_desk_runbook.md, span: "P2: major team blocked with no workaround", style: lexical}
  - {q: "How urgent is a request where one person is stuck but has a partial workaround?", source: sample_kb/service_desk_runbook.md, span: "P3: individual user blocked or degraded", style: paraphrase}
